version: 2
updates:
  # Versions are pinned exactly in gradle/libs.versions.toml, so updates arrive as
  # reviewable pull requests rather than being picked up silently.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
