name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # detekt (with the ktlint rule set), Android Lint, unit tests, and the
      # no-network manifest gate for every module - see PLAN.md 9.
      - name: Run all verification gates
        run: ./gradlew verifyAll --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  dependency-check:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory only: a new CVE disclosure should not block an unrelated pull request.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      # Deliberately no setup-java here. This action runs inside a Docker container that
      # ships its own JDK; setup-java exports a JAVA_HOME pointing at a host path which
      # does not exist in the container, and the scan dies with
      # "JAVA_HOME is not defined correctly".
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: storage-bundle
          path: '.'
          format: 'HTML'
          # Single-line scalar: a folded (>) block appends a newline, and the action
          # passes the whole value as one argument, so the flags never parse.
          args: '--failOnCVSS 7 --enableExperimental'

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 14
          if-no-files-found: ignore
