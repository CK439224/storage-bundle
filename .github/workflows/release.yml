name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore never lives in the repository (VERSIONING.md). It is reconstructed
      # here from secrets and removed with the runner.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; cannot sign a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi
          echo "Releasing $VERSION"

      - name: Run verification gates
        run: ./gradlew verifyAll --no-daemon

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon

      # Belt and braces: the build already fails if a network permission is present,
      # but assert it against the actual shipped artifact too.
      - name: Assert no network permission in the APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Inspecting $APK"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt2 dump permissions "$APK" > perms.txt
          cat perms.txt
          if grep -qE 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' perms.txt; then
            echo "::error::Released APK requests a network permission."
            exit 1
          fi

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: true
